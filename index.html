<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultra Love Universe</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial;
}

/* start button */
#startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 30px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(45deg,#ff4d6d,#ff99cc);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 20px pink;
}

/* LOVE TEXT */
.love {
    position: absolute;
    font-size: 34px;   /* BIGGER */
    font-weight: 900;
    color: #ff4d6d;
    user-select: none;
    cursor: pointer;
    text-shadow: 0 0 10px rgba(255,77,109,0.5);
}

/* burst particles */
.particle {
    position: absolute;
    font-size: 18px;
    font-weight: bold;
    pointer-events: none;
    animation: pop 2s ease-out forwards;
}

@keyframes pop {
    0% {
        transform: translate(0,0) scale(0.5);
        opacity: 1;
    }
    100% {
        transform: translate(var(--x), var(--y)) scale(1.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<button id="startBtn">এই যে মেডাম এইখানে চাপ দেন ❤️</button>

<script>

let loves = [];
let count = 30;

/* create love */
function createLove() {
    const el = document.createElement("div");
    el.className = "love";
    el.innerText = "I Love You 💖";

    let x = Math.random() * window.innerWidth;
    let y = Math.random() * window.innerHeight;

    el.style.left = x + "px";
    el.style.top = y + "px";

    // random movement speed
    el.vx = (Math.random() - 0.5) * 1.5;
    el.vy = (Math.random() - 0.5) * 1.5;

    // click event
    el.onclick = (e) => {
        e.stopPropagation();

        // DOUBLE COUNT (2x system)
        for (let i = 0; i < count; i++) {
            createLove();
        }
        count *= 2;

        // color burst
        burst(x, y);

        // move away effect (2 sec)
        el.vx += (Math.random() - 0.5) * 10;
        el.vy += (Math.random() - 0.5) * 10;

        setTimeout(() => {
            el.vx *= 0.2;
            el.vy *= 0.2;
        }, 2000);
    };

    document.body.appendChild(el);
    loves.push(el);
}

/* animation loop */
function animate() {
    loves.forEach(el => {
        let x = parseFloat(el.style.left);
        let y = parseFloat(el.style.top);

        x += el.vx;
        y += el.vy;

        // bounce inside screen
        if (x < 0 || x > window.innerWidth) el.vx *= -1;
        if (y < 0 || y > window.innerHeight) el.vy *= -1;

        el.style.left = x + "px";
        el.style.top = y + "px";
    });

    requestAnimationFrame(animate);
}

/* burst effect */
function burst(x, y) {
    const colors = ["#ff4d6d","#ffcc00","#00ffff","#ff66ff","#00ff99"];

    for (let i = 0; i < 15; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.innerText = "❤️";
        p.style.left = x + "px";
        p.style.top = y + "px";
        p.style.color = colors[Math.floor(Math.random()*colors.length)];

        let angle = Math.random() * Math.PI * 2;
        let dist = Math.random() * 120;

        p.style.setProperty("--x", Math.cos(angle)*dist + "px");
        p.style.setProperty("--y", Math.sin(angle)*dist + "px");

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 2000);
    }
}

/* start */
document.getElementById("startBtn").onclick = () => {
    document.getElementById("startBtn").style.display = "none";

    for (let i = 0; i < 30; i++) {
        createLove();
    }

    animate();
};

</script>

</body>
</html>
